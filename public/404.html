<html>
  <head>
    <meta charset="utf-8" />
    <title>Bornfree</title>
    <script>
      // GitHub Pages 404 重定向：将路径保存到 sessionStorage，然后跳转到首页
      const segment = 1
      const path = window.location.pathname.slice(1).split('/').slice(segment).join('/')
      const redirect = '/BornfreeYan/?redirect=' + encodeURIComponent(path)
      window.location.replace(redirect)
    </script>
  </head>
